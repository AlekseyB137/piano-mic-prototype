<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" />
    <title>Piano Mic Test</title>
    <!-- Единственный внешний скрипт. Вне Telegram он безопасен: WebApp.platform = 'unknown'. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="app">
      <header class="toolbar">
        <button id="btn-start" class="primary">Старт</button>
        <button id="btn-calib" disabled>Тишина 2 с</button>
        <div class="seg" id="mode">
          <button data-mode="free" class="active">Свободный</button>
          <button data-mode="check">Проверка</button>
          <button data-mode="song">Песня</button>
        </div>
        <span class="spacer"></span>
        <span id="status-dot" class="dot" title="Состояние аудио"></span>
        <button id="btn-debug">Отладка</button>
      </header>
      <div id="message" class="message hidden"></div>
      <main class="stage">
        <section id="readout" class="readout"></section>
        <section class="log">
          <div class="log-head">
            <span>События</span>
            <button id="btn-log-clear" class="small">Очистить</button>
          </div>
          <ol id="log"></ol>
        </section>
        <section id="song" class="song">
          <canvas id="song-canvas"></canvas>
          <div class="song-hud">
            <button id="song-choose" class="small">Выбор мелодии</button>
            <button id="song-restart" class="small">Сначала</button>
            <div class="seg small-seg" id="song-tempo">
              <button class="small" data-tempo="0.5">50%</button>
              <button class="small" data-tempo="0.75">75%</button>
              <button class="small" data-tempo="1">100%</button>
            </div>
            <div class="seg small-seg" id="song-play-mode">
              <button class="small" data-play="wait">Ожидание</button>
              <button class="small" data-play="tempo">В такт</button>
            </div>
            <span id="song-status" class="song-status"></span>
          </div>
          <div id="song-done" class="song-done hidden"></div>
          <div id="song-picker" class="song-picker hidden"></div>
        </section>
        <aside id="debug" class="debug collapsed"></aside>
        <div id="scenario" class="scenario hidden"></div>
      </main>
      <div id="keyboard"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <!-- Только горизонтально: вертикально экран затемняется (повернуть сам браузер на iOS не даёт) -->
    <div id="rotate-hint" class="rotate-hint" aria-live="polite">
      <svg class="rotate-icon" viewBox="0 0 120 120" width="120" height="120" aria-hidden="true">
        <g class="rotate-phone">
          <rect x="42" y="22" width="36" height="66" rx="7" fill="none" stroke="currentColor" stroke-width="5" />
          <line x1="54" y1="80" x2="66" y2="80" stroke="currentColor" stroke-width="4" stroke-linecap="round" />
        </g>
        <path d="M 30 96 A 46 46 0 0 1 22 44" fill="none" stroke="var(--warn)" stroke-width="5" stroke-linecap="round" />
        <path d="M 12 52 L 22 40 L 32 52" fill="none" stroke="var(--warn)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <div class="rotate-text">Поверните экран</div>
      <div class="rotate-sub">Приложение работает только горизонтально</div>
    </div>
  </body>
</html>
